name: Android APK

# Builds an installable APK so the app can be tested on a real phone without
# needing a computer: run this, then download the artifact on the phone and
# install it. Manual by default because a full native build takes ~10 minutes
# and most pushes do not need one.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install
        run: pnpm install --frozen-lockfile

      # The project is managed: android/ is generated here rather than
      # committed, so app.json stays the single source of truth.
      - name: Generate the native project
        working-directory: apps/collector
        run: npx expo prebuild --platform android --no-install

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/collector/android/**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      # Debug rather than release: a release APK needs a signing key, and an
      # unsigned release build will not install on a phone. Debug is signed
      # with the standard debug key and installs fine for testing.
      - name: Build
        working-directory: apps/collector/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the artifact
        id: name
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ewaste-collector-${{ steps.name.outputs.sha }}
          path: apps/collector/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Report size
        run: |
          apk=$(find apps/collector/android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          size=$(du -h "$apk" | cut -f1)
          echo "### APK built: $size" >> "$GITHUB_STEP_SUMMARY"
          echo "Download it from the Artifacts section of this run, open it on your phone and install." >> "$GITHUB_STEP_SUMMARY"
